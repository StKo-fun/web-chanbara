<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web Chanbara - iPhone Controller</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      touch-action: manipulation;
    }
    .header { text-align: center; }
    .room-row { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
    input {
      background: #1e293b; border: 2px solid #38bdf8; color: #fff;
      font-size: 24px; font-weight: bold; width: 130px; text-align: center;
      border-radius: 10px; padding: 8px; letter-spacing: 4px;
    }
    .btn-primary {
      background: #0284c7; color: #fff; border: none; border-radius: 10px;
      padding: 0 20px; font-size: 16px; font-weight: bold;
    }
    .btn-primary.active { background: #16a34a; }
    .warn-box {
      background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b;
      color: #fcd34d; font-size: 12px; padding: 10px; border-radius: 8px;
      text-align: center; margin-top: 12px;
    }
    .guard-area {
      flex: 1; margin: 20px 0;
      background: #1e293b; border: 3px solid #475569; border-radius: 24px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      font-size: 26px; font-weight: bold; color: #94a3b8;
      transition: all 0.1s;
    }
    .guard-area.guarding {
      background: #1d4ed8; border-color: #60a5fa; color: #fff; transform: scale(0.98);
    }
    .footer-btns { display: flex; gap: 12px; }
    .btn-sub {
      flex: 1; background: #334155; color: #e2e8f0; border: none;
      padding: 16px; border-radius: 14px; font-size: 15px; font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="font-size:14px; color:#94a3b8;">TV画面の4桁コードを入力</div>
    <div class="room-row">
      <input id="room-input" type="tel" maxlength="4" placeholder="0000">
      <button id="connect-btn" class="btn-primary">接続＆センサーON</button>
    </div>
    <div class="warn-box">
      ⚠️ 落下防止のためiPhoneをしっかり握り、手首のスナップで軽く振ってください
    </div>
  </div>

  <div id="guard-btn" class="guard-area">
    <div>🛡️ 長押しで防御（ガード）</div>
    <div style="font-size:13px; font-weight:normal; margin-top:8px;" id="sensor-debug">待機中...</div>
  </div>

  <div class="footer-btns">
    <button id="calib-btn" class="btn-sub">🎯 構えの角度をリセット</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // ★tv.htmlと同じFirebase設定を貼り付けてください★
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "000000000000",
      appId: "1:000000000000:web:000000000000"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const roomInput = document.getElementById("room-input");
    const connectBtn = document.getElementById("connect-btn");
    const guardBtn = document.getElementById("guard-btn");
    const debugEl = document.getElementById("sensor-debug");

    // URLパラメータに ?room=1234 があれば自動入力
    const params = new URLSearchParams(window.location.search);
    if (params.get("room")) roomInput.value = params.get("room");

    let isConnected = false;
    let baseGamma = 0;
    let currentAngle = 0;
    let isGuarding = false;
    let lastPoseSent = 0;
    let lastSwingTime = 0;

    // センサー許可と接続開始
    connectBtn.addEventListener("click", async () => {
      const roomId = roomInput.value.trim();
      if (roomId.length !== 4) {
        alert("4桁のルームIDを入力してください");
        return;
      }

      // iOS 13+ センサー許可リクエスト
      try {
        if (typeof DeviceMotionEvent?.requestPermission === "function") {
          const motionRes = await DeviceMotionEvent.requestPermission();
          if (motionRes !== "granted") return alert("加速度センサーが許可されませんでした");
        }
        if (typeof DeviceOrientationEvent?.requestPermission === "function") {
          const orientRes = await DeviceOrientationEvent.requestPermission();
          if (orientRes !== "granted") return alert("ジャイロセンサーが許可されませんでした");
        }
      } catch (e) {
        console.warn("Sensor permission error:", e);
      }

      // スリープ防止
      if ("wakeLock" in navigator) {
        navigator.wakeLock.request("screen").catch(() => {});
      }

      isConnected = true;
      connectBtn.textContent = "接続中";
      connectBtn.classList.add("active");
      update(ref(db, `chanbara/${roomId}`), { connected: true });

      window.addEventListener("deviceorientation", handleOrientation);
      window.addEventListener("devicemotion", handleMotion);
    });

    // 傾きによる剣の角度同期（約25fpsに間引き）
    function handleOrientation(e) {
      if (!isConnected || e.gamma === null) return;
      // iPhoneの左右の傾き(gamma)をラジアンに変換
      const rawRad = ((e.gamma - baseGamma) * Math.PI) / 180;
      currentAngle = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rawRad));

      const now = Date.now();
      if (now - lastPoseSent > 40) {
        lastPoseSent = now;
        const roomId = roomInput.value.trim();
        set(ref(db, `chanbara/${roomId}/pose`), {
          angle: Number(currentAngle.toFixed(2)),
          guard: isGuarding
        });
        debugEl.textContent = `角度: ${Math.round((currentAngle * 180) / Math.PI)}°`;
      }
    }

    // スイング検知
    function handleMotion(e) {
      if (!isConnected || isGuarding) return;
      const acc = e.acceleration;
      if (!acc || acc.x === null) return;

      const magnitude = Math.sqrt(acc.x ** 2 + acc.y ** 2 + acc.z ** 2);
      const now = Date.now();

      // しきい値 18 m/s^2 以上でスイング判定
      if (magnitude > 18 && now - lastSwingTime > 380) {
        lastSwingTime = now;

        // 振った軸の比率から斬撃角度（縦斬り・横斬り・斜め斬り）を算出
        const slashAngle = Math.atan2(acc.x, -acc.y);
        const roomId = roomInput.value.trim();
        set(ref(db, `chanbara/${roomId}/slash`), {
          angle: Number(slashAngle.toFixed(2)),
          power: Number(Math.min(magnitude / 40, 1.0).toFixed(2)),
          timestamp: now
        });
      }
    }

    // ガードボタン（タッチ長押し）
    const setGuard = (active) => {
      isGuarding = active;
      guardBtn.classList.toggle("guarding", active);
      if (!isConnected) return;
      const roomId = roomInput.value.trim();
      set(ref(db, `chanbara/${roomId}/pose`), {
        angle: Number(currentAngle.toFixed(2)),
        guard: isGuarding
      });
    };
    guardBtn.addEventListener("touchstart", (e) => { e.preventDefault(); setGuard(true); });
    guardBtn.addEventListener("touchend", (e) => { e.preventDefault(); setGuard(false); });

    // 正面キャリブレーション
    document.getElementById("calib-btn").addEventListener("click", () => {
      baseGamma += (currentAngle * 180) / Math.PI;
    });
  </script>
</body>
</html>
